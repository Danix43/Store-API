spring:
    main:
        banner-mode: "off"
    # h2 database setup
    h2:
        console:
            enabled: true
    datasource:
        url: jdbc:h2:mem:storeDb
        driver-class-name: org.h2.Driver
        username: user
        password: pass
    jpa:
        show-sql: true
        defer-datasource-initialization: true
        hibernate:
            ddl-auto: create-drop
logging:
    level:
        web: DEBUG
